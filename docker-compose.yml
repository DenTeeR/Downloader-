services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./cookies:/app/cookies:ro

  # Optional: local Bot API server, lifts the upload limit from 50 MB to 2000 MB.
  # Enable with:  docker compose --profile local-api up -d
  # and set BOT_API_SERVER=http://telegram-bot-api:8081 in .env
  telegram-bot-api:
    image: aiogram/telegram-bot-api:10.3
    profiles: ["local-api"]
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api

  # Optional: PO-token provider that helps YouTube downloads from server IPs.
  # Enable with:  docker compose --profile youtube-pot up -d
  # and set YOUTUBE_POT_URL=http://pot-provider:4416 in .env
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2
    profiles: ["youtube-pot"]
    restart: unless-stopped

volumes:
  telegram-bot-api-data:
